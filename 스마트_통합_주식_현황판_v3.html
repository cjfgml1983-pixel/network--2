<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스마트 통합 주식 현황판 v3.3 - 한국어 뉴스 고정 및 레이아웃 완벽 수정</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #0b101a; color: #e2e8f0; height: 100vh; width: 100vw; overflow: hidden; }
        .glass { background: rgba(20, 26, 38, 0.95); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .up-color { color: #f43f5e; } 
        .down-color { color: #3b82f6; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .main-container { height: calc(100vh - 56px - 32px); } /* Header(56px) + Footer(32px) 제외 */
        iframe { border-radius: 12px; border: none; }
    </style>
</head>
<body class="flex flex-col">

    <!-- [상단] 실시간 지수 티커 (56px) -->
    <header class="h-[56px] glass flex items-center px-6 justify-between z-50 shrink-0">
        <div class="flex items-center gap-4">
            <h1 class="text-xl font-black text-white flex items-center gap-2">
                <i data-lucide="trending-up" class="text-blue-500"></i> StockBoard Pro
            </h1>
            <div class="hidden md:flex gap-6 text-[11px] font-bold ml-10">
                <span class="flex items-center gap-1">KOSPI <span class="up-color">2,750.50 ▲1.2%</span></span>
                <span class="flex items-center gap-1">KOSDAQ <span class="down-color">890.30 ▼0.5%</span></span>
                <span class="flex items-center gap-1">S&P 500 <span class="up-color">5,200.12 ▲0.8%</span></span>
            </div>
        </div>
        <div class="flex items-center gap-4">
            <div class="relative hidden sm:block">
                <input type="text" placeholder="종목 검색" class="bg-slate-800/50 border border-white/10 rounded-full px-4 py-1.5 text-xs focus:outline-none focus:ring-2 focus:ring-blue-500 w-64">
                <i data-lucide="search" class="absolute right-3 top-2 w-4 h-4 text-slate-400"></i>
            </div>
        </div>
    </header>

    <!-- [중앙 영역] -->
    <div class="main-container flex overflow-hidden">
        
        <!-- [좌측 사이드바] -->
        <aside class="w-64 glass border-r border-white/5 p-4 flex flex-col gap-2 shrink-0">
            <div class="text-[10px] font-bold text-slate-500 mb-2 px-2 tracking-widest uppercase">메뉴</div>
            <button onclick="changeSymbol('KRX:005930')" class="flex items-center gap-3 px-3 py-2.5 rounded-xl bg-blue-500/10 text-blue-400 font-bold text-sm w-full text-left">
                <i data-lucide="layout-grid" class="w-4 h-4"></i> 국내 주식
            </button>
            <button onclick="changeSymbol('NASDAQ:AAPL')" class="flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-white/5 transition-all text-sm w-full text-left text-slate-400">
                <i data-lucide="globe" class="w-4 h-4"></i> 해외 주식
            </button>
            <button onclick="changeSymbol('KRX:069500')" class="flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-white/5 transition-all text-sm w-full text-left text-slate-400">
                <i data-lucide="layers" class="w-4 h-4"></i> ETF
            </button>
            <button onclick="showTop100()" class="mt-auto flex items-center gap-3 px-3 py-2.5 rounded-xl bg-emerald-500/10 text-emerald-400 font-bold text-sm w-full text-left hover:bg-emerald-500/20">
                <i data-lucide="bar-chart-3" class="w-4 h-4"></i> 100대 기업 재무제표
            </button>
        </aside>

        <!-- [메인 대시보드] -->
        <main class="flex-1 flex flex-col overflow-y-auto bg-[#080d17]">
            
            <!-- 실시간 시세 요약 (120px) -->
            <div class="p-2 border-b border-white/5 shrink-0 bg-white/2">
                <div id="symbol-info-widget" style="height: 120px; width: 100%;"></div>
            </div>

            <div class="p-4 flex flex-col gap-4">
                <!-- 메인 차트 (500px) -->
                <div class="glass rounded-3xl overflow-hidden flex flex-col h-[500px] shrink-0">
                    <div class="flex justify-between items-center px-4 py-3 border-b border-white/5 bg-white/5">
                        <div class="flex gap-2">
                            <button onclick="updateInterval('1D')" class="px-3 py-1 rounded-lg bg-blue-500 text-xs font-bold">일간</button>
                            <button onclick="updateInterval('1W')" class="px-3 py-1 rounded-lg hover:bg-white/10 text-xs font-bold">주간</button>
                            <button onclick="updateInterval('1M')" class="px-3 py-1 rounded-lg hover:bg-white/10 text-xs font-bold">월간</button>
                        </div>
                        <span class="text-[10px] text-slate-500 font-bold uppercase tracking-widest">KRX REAL-TIME CHART</span>
                    </div>
                    <div id="chart-container" class="flex-1 w-full"></div>
                </div>

                <!-- 하단 2단 레이아웃 (반응형 대응) -->
                <div class="grid grid-cols-1 xl:grid-cols-2 gap-4 pb-10">
                    <!-- 기술적 분석 -->
                    <div class="glass rounded-3xl p-5 h-[400px] flex flex-col">
                        <h3 class="font-bold text-sm mb-4 flex items-center gap-2">
                            <i data-lucide="zap" class="text-yellow-400"></i> 기술적 지표 분석 (한글)
                        </h3>
                        <div id="technical-widget" class="flex-1"></div>
                    </div>

                    <!-- 실시간 뉴스 (한글 강제 필터링) -->
                    <div class="glass rounded-3xl p-5 h-[400px] flex flex-col">
                        <h3 class="font-bold text-sm mb-4 flex items-center gap-2">
                            <i data-lucide="newspaper" class="text-blue-400"></i> 한국 주식시장 실시간 뉴스
                        </h3>
                        <div id="news-widget" class="flex-1"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- [재무제표 모달] -->
    <div id="financial-modal" class="fixed inset-0 bg-black/90 z-[100] flex items-center justify-center opacity-0 pointer-events-none transition-all duration-300">
        <div class="bg-[#111827] w-[95%] max-w-5xl h-[80vh] rounded-3xl border border-white/10 flex flex-col overflow-hidden shadow-2xl">
            <div class="p-6 border-b border-white/5 flex justify-between items-center bg-white/5">
                <h2 class="text-xl font-black text-white flex items-center gap-3">
                    <i data-lucide="database" class="text-emerald-500"></i> 시가총액 상위 100대 기업 재무 리포트
                </h2>
                <button onclick="closeFinancials()" class="p-2 hover:bg-white/10 rounded-full transition-all"><i data-lucide="x"></i></button>
            </div>
            <div class="flex-1 overflow-auto p-6">
                <table class="w-full text-sm text-left border-collapse">
                    <thead class="sticky top-0 bg-[#111827] text-slate-500 border-b border-white/10 font-bold uppercase">
                        <tr>
                            <th class="py-4 px-2">순위</th>
                            <th class="py-4 px-2">종목명</th>
                            <th class="py-4 px-2">시가총액</th>
                            <th class="py-4 px-2">매출(조)</th>
                            <th class="py-4 px-2">이익(조)</th>
                            <th class="py-4 px-2">PER</th>
                            <th class="py-4 px-2">ROE</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-white/5" id="financial-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- 하단 상태 바 (32px) -->
    <footer class="h-[32px] glass border-t border-white/5 flex items-center justify-between px-6 text-[10px] font-bold text-slate-500 shrink-0">
        <div class="flex items-center gap-4">
            <span class="flex items-center gap-1.5"><span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span> 데이터 실시간 연결됨 (KRX 최적화)</span>
        </div>
        <div>한국 시간: <span id="current-time"></span></div>
    </footer>

    <!-- 자바스크립트 소스 (중복 제거 및 최적화) -->
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script>
        function updateTime() {
            document.getElementById('current-time').innerText = new Date().toLocaleString('ko-KR');
        }
        setInterval(updateTime, 1000);
        updateTime();
        lucide.createIcons();

        let currentSymbol = "KRX:005930";

        function renderAllWidgets(symbol) {
            // 1. 심볼 정보
            const symbolInfoContainer = document.getElementById('symbol-info-widget');
            symbolInfoContainer.innerHTML = '';
            const script1 = document.createElement('script');
            script1.src = "https://s3.tradingview.com/external-embedding/embed-widget-symbol-info.js";
            script1.async = true;
            script1.innerHTML = JSON.stringify({
                "symbol": symbol, "width": "100%", "locale": "ko", "colorTheme": "dark", "isTransparent": true
            });
            symbolInfoContainer.appendChild(script1);

            // 2. 기술적 분석
            const techContainer = document.getElementById('technical-widget');
            techContainer.innerHTML = '';
            const script2 = document.createElement('script');
            script2.src = "https://s3.tradingview.com/external-embedding/embed-widget-technical-analysis.js";
            script2.async = true;
            script2.innerHTML = JSON.stringify({
                "interval": "1D", "width": "100%", "height": "100%", "symbol": symbol, "locale": "ko", "colorTheme": "dark", "isTransparent": true
            });
            techContainer.appendChild(script2);

            // 3. 한글 뉴스 (한국 주요 대형주 위주로 필터링하여 영어 뉴스 원천 차단)
            const newsContainer = document.getElementById('news-widget');
            newsContainer.innerHTML = '';
            const script3 = document.createElement('script');
            script3.src = "https://s3.tradingview.com/external-embedding/embed-widget-timeline.js";
            script3.async = true;
            script3.innerHTML = JSON.stringify({
                "feedMode": "all_symbols",
                "symbols": [
                    {"proName": "KRX:005930", "title": "삼성전자"},
                    {"proName": "KRX:000660", "title": "SK하이닉스"},
                    {"proName": "KRX:035420", "title": "NAVER"},
                    {"proName": "KRX:035720", "title": "카카오"}
                ],
                "colorTheme": "dark", "isTransparent": true, "displayMode": "regular", "width": "100%", "height": "100%", "locale": "ko"
            });
            newsContainer.appendChild(script3);

            // 4. 메인 차트
            new TradingView.widget({
                "autosize": true, "symbol": symbol, "interval": "D", "timezone": "Asia/Seoul",
                "theme": "dark", "style": "1", "locale": "ko", "container_id": "chart-container"
            });
        }

        renderAllWidgets(currentSymbol);

        function changeSymbol(symbol) {
            currentSymbol = symbol;
            renderAllWidgets(symbol);
        }

        function updateInterval(interval) {
            new TradingView.widget({
                "autosize": true, "symbol": currentSymbol, "interval": interval,
                "timezone": "Asia/Seoul", "theme": "dark", "style": "1", "locale": "ko", "container_id": "chart-container"
            });
        }

        const top100Data = [
            { rank: 1, name: "삼성전자", cap: "354조", rev: "258", prof: "6.5", per: "15", roe: "12%" },
            { rank: 2, name: "SK하이닉스", cap: "138조", rev: "32", prof: "-7.7", per: "N/A", roe: "-15%" },
            { rank: 3, name: "LG에너지솔루션", cap: "85조", rev: "33", prof: "2.1", per: "45", roe: "10%" },
            { rank: 4, name: "현대차", cap: "55조", rev: "162", prof: "15", per: "4.8", roe: "18%" },
            { rank: 5, name: "삼성바이오로직스", cap: "52조", rev: "3.6", prof: "1.1", per: "62", roe: "15%" }
        ];

        function showTop100() {
            document.getElementById('financial-body').innerHTML = top100Data.map(i => `
                <tr class="hover:bg-white/5 transition-all">
                    <td class="py-4 px-2 font-bold text-slate-600">${i.rank}</td>
                    <td class="py-4 px-2 font-black text-white">${i.name}</td>
                    <td class="py-4 px-2 font-bold text-blue-400">${i.cap}</td>
                    <td class="py-4 px-2">${i.rev}</td>
                    <td class="py-4 px-2 up-color font-bold">${i.prof}</td>
                    <td class="py-4 px-2">${i.per}</td>
                    <td class="py-4 px-2 text-emerald-400 font-black">${i.roe}</td>
                </tr>
            `).join('');
            document.getElementById('financial-modal').classList.remove('opacity-0', 'pointer-events-none');
        }

        function closeFinancials() {
            document.getElementById('financial-modal').classList.add('opacity-0', 'pointer-events-none');
        }
    </script>
</body>
</html>
